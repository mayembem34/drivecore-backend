name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: drivecore_test
          POSTGRES_USER: drivecore
          POSTGRES_PASSWORD: testing-only
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U drivecore -d drivecore_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-bookworm
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'drivecore_test' }}
      DB_USERNAME: drivecore
      DB_PASSWORD: testing-only
      DB_URL: ''
      AUTH_REQUIRE_HTTPS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, intl, bcmath, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - run: composer audit --locked --no-interaction
      - run: vendor/bin/pint --format agent && git diff --exit-code
      - run: bash tests/deployment/transport.sh
      - run: bash tests/deployment/acme.sh
      - run: php artisan test --compact
      - name: Check real database and Redis
        if: matrix.database == 'pgsql'
        env:
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1
        run: php artisan drivecore:check --no-interaction
