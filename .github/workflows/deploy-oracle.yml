name: Deploy Oracle development server

on:
  workflow_dispatch:
    inputs:
      enable_https:
        description: 'Enable trusted IP HTTPS (first allow OCI ingress TCP 443)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drivecore-oracle-development
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/drivecore_actions
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH'
          Host drivecore
            HostName 158.180.34.27
            User ubuntu
            IdentityFile ~/.ssh/drivecore_actions
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          SSH

      - name: Transfer selected commit
        run: |
          set -euo pipefail
          git bundle create /tmp/drivecore.bundle HEAD
          ssh drivecore "install -d -m 700 /home/ubuntu/drivecore-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp /tmp/drivecore.bundle "drivecore:/home/ubuntu/drivecore-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/source.bundle"

      - name: Back up and deploy
        run: |
          set -euo pipefail
          scp deploy/server.sh "drivecore:/home/ubuntu/drivecore-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/deploy.sh"
          ssh -n drivecore bash "/home/ubuntu/drivecore-deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/deploy.sh" "$GITHUB_SHA" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Enable trusted IP HTTPS
        if: inputs.enable_https
        run: ssh drivecore bash /opt/drivecore/backend/deploy/enable-tls.sh

      - name: Check public HTTPS endpoint
        if: inputs.enable_https
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 https://158.180.34.27/up > /dev/null

      - name: Check public health endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 http://158.180.34.27/up > /dev/null

      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/drivecore_actions
