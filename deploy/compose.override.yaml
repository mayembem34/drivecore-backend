services:
  app:
    image: drivecore-php:8.4
    restart: unless-stopped
    user: "${APP_UID}:${APP_GID}"
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    networks:
      - backend
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
      - outbound
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: drivecore-php:8.4
    restart: unless-stopped
    user: "${APP_UID}:${APP_GID}"
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 75s
    volumes:
      - ..:/var/www/html
    networks:
      - backend
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: drivecore-php:8.4
    restart: unless-stopped
    user: "${APP_UID}:${APP_GID}"
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - ..:/var/www/html
    networks:
      - backend
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  outbound:
